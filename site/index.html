<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Advances</title>
  <meta name="description" content="Where AI is heading: capability trends, dated forecasts, and what each lab is working on. Updated daily from public data.">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="Pages">
      <a class="brand" href="#/trends"><img src="icon.png" alt="" width="28" height="28"><span>AI Advances</span></a>
      <ul id="nav"></ul>
      <button class="feedback-tab" id="feedback-open" type="button" title="Send feedback about AI Advances">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6a1.5 1.5 0 0 1-1.5 1.5H7l-3 3v-3h-.5A1.5 1.5 0 0 1 2 9.5z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        Feedback
      </button>
    </nav>
    <div class="main">
      <header class="topbar">
        <span id="page-name"></span>
        <details class="sources">
          <summary id="status">Loading…</summary>
          <div class="sources-panel" id="sources-panel"></div>
        </details>
      </header>
      <main id="page" tabindex="-1"><p class="muted">Loading data…</p></main>
    </div>
  </div>

  <dialog id="feedback">
    <form method="dialog" id="feedback-form">
      <h2>Feedback</h2>
      <p class="muted">What's missing, wrong, or confusing? This opens a pre-filled GitHub issue you can review before posting.</p>
      <div class="segmented" role="radiogroup" aria-label="Type">
        <label><input type="radio" name="kind" value="Idea" checked><span>Idea</span></label>
        <label><input type="radio" name="kind" value="Bug"><span>Bug</span></label>
        <label><input type="radio" name="kind" value="Data looks wrong"><span>Data looks wrong</span></label>
      </div>
      <textarea id="feedback-text" rows="6" aria-label="Feedback" placeholder="Your feedback"></textarea>
      <div class="dialog-buttons">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="send" class="primary" id="feedback-send" disabled>Open GitHub issue</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
